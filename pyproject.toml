[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xyzgeom"
version = "0.1.0"
description = "Basic geometry calculations (bond distance, angle, center of mass, radius of gyration) from .xyz molecular coordinate files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Siddharth" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
xyzgeom = "xyzgeom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
